<!doctype html>
<html lang="zh-CN" class="wa-light">
<head>
  <meta charset="UTF-8">
  <title>大懒虫</title>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="assets/logo.png" alt=""><strong>大懒虫</strong></div>
    <button id="open-workspace" class="btn sm outline" type="button">批量下载<wa-icon name="maximize"></wa-icon></button>
  </header>

  <div id="auto-status" class="auto-status" role="status" aria-live="polite" hidden><wa-spinner></wa-spinner><span id="auto-text"></span></div>

  <div class="list-head">
    <wa-checkbox id="select-all"><span class="sr-only">全选</span></wa-checkbox>
    <span>已监听视频</span><span id="page-count" class="counter">0</span>
    <span class="list-gap"></span>
    <button id="clear" class="btn sm danger" type="button" title="清空已监听的视频" hidden><wa-icon name="trash-2"></wa-icon>清空</button>
  </div>
  <div id="media-list" class="media-list"></div>
  <div id="empty" class="empty">
    <wa-icon name="video"></wa-icon>
    <strong>还没有监听到视频</strong>
    <span>在网页中播放视频后会自动出现在这里</span>
  </div>

  <footer id="batch" class="batch" hidden>
    <span id="batch-summary"></span>
    <button id="batch-download" class="btn sm primary" type="button"><wa-icon name="download"></wa-icon><span id="batch-label">全部下载</span></button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
